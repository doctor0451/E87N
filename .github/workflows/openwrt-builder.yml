# https://github.com/P3TERX/Actions-OpenWrt
# File: .github/workflows/openwrt-builder.yml
# Description: Build ImmortalWrt MT7987A EdgePI E87N No-WiFi
name: OpenWrt Builder
on:
  repository_dispatch:
  workflow_dispatch:
env:
  REPO_URL: https://github.com/Hiveton/higowrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
    - name: Checkout 仓库配置文件
      uses: actions/checkout@main
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
    - name: Clone MT798x 源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt || \
        git clone $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    - name: Load custom feeds(diy-part1)
      run: |
        cd "$GITHUB_WORKSPACE"
        [ -e $FEEDS_CONF ] && cp -v $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"
    - name: Update feeds
      run: cd "$GITHUB_WORKSPACE/openwrt" && ./scripts/feeds update -a
    - name: Install feeds
      run: cd "$GITHUB_WORKSPACE/openwrt" && ./scripts/feeds install -a
    - name: Load custom config & diy-part2.sh
      run: |
        cd "$GITHUB_WORKSPACE"
        [ -e files ] && cp -r files openwrt/files
        [ -e $CONFIG_FILE ] && cp -v $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        # 直接执行脚本，脚本内部会处理路径
        "$GITHUB_WORKSPACE/$DIY_P2_SH"
    - name: Download package source
      id: package
      run: |
        cd "$GITHUB_WORKSPACE/openwrt"
        
        # 先执行 defconfig
        make defconfig
        
        # 显示当前配置中的 WiFi 选项
        echo "=== 当前 .config 中的 WiFi 相关选项 ==="
        grep -i wifi .config | grep -v "^#" || echo "无 WiFi 选项"
        
        # 显示包目录状态
        echo "=== package/mtk/drivers/ 目录内容 ==="
        ls -la package/mtk/drivers/ || echo "目录不存在"
        
        # 尝试 olddefconfig
        if ! make olddefconfig -j1; then
          echo "::error:: olddefconfig failed, re-running with V=s"
          make olddefconfig V=s 2>&1 | tee ../olddefconfig.log
          echo "=== olddefconfig 错误详情 ==="
          tail -100 ../olddefconfig.log
          exit 1
        fi
        
        # 下载源码包
        if ! make download -j8; then
          echo "::warning:: download with -j8 failed, retrying with -j1"
          make download -j1 2>&1 | tee ../make-download.log
          exit 1
        fi
        
        # 清理不完整的下载文件
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile firmware EdgePI E87N MT7987A
      id: compile
      run: |
        cd "$GITHUB_WORKSPACE/openwrt"
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
    - name: Check disk space
      if: (!cancelled())
      run: df -hT
    - name: Upload bin directory artifact
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
    - name: Organize firmware files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd "$GITHUB_WORKSPACE/openwrt"
        # 使用通配符匹配实际路径
        FIRMWARE_DIR=$(find bin/targets -type d -name "filogic" 2>/dev/null | head -1)
        if [ -d "$FIRMWARE_DIR" ]; then
          cd "$FIRMWARE_DIR"
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "::error::Firmware directory not found! Check if compilation succeeded."
          echo "Contents of bin/targets:"
          ls -la bin/targets/ 2>/dev/null || echo "bin/targets not found"
          exit 1
        fi
    - name: Upload firmware artifact
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
    - name: Generate Release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "### EdgePI E87N MT7987A 无WiFi固件" > release.txt
        echo "- 源码：Hiveton/higowrt (OpenWrt 25.12.4)" >> release.txt
        echo "- CPU: MT7987A 8G eMMC 双NVME插槽 无内置WiFi" >> release.txt
        echo "- 编译时间: $(date +"%Y-%m-%d %H:%M:%S")" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware to GitHub Release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.buildinfo
    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 5
    - name: Auto clean old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
